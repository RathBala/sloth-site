<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1688" viewBox="0 0 780 1688" role="img" aria-labelledby="title description">
  <title id="title">Sloth Agent CLI automation session</title>
  <desc id="description">Terminal commands for reviewing uncategorised transactions, previewing a budget move, and reading savings goals before an affordability check.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063f2d" />
      <stop offset="1" stop-color="#0b211b" />
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101915" />
      <stop offset="1" stop-color="#07110d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#00100a" flood-opacity="0.45" />
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { fill: #76d49a; font-size: 24px; font-weight: 700; letter-spacing: 1.1px; }
      .command { fill: #f5fbf7; font-size: 25px; }
      .muted { fill: #9eb5aa; font-size: 23px; }
      .json-key { fill: #8ad5b0; }
      .json-value { fill: #f5cf72; }
    </style>
  </defs>

  <rect width="780" height="1688" fill="url(#background)" />
  <circle cx="74" cy="128" r="182" fill="#18a867" opacity="0.08" />
  <circle cx="734" cy="1544" r="214" fill="#f0c85f" opacity="0.06" />

  <g filter="url(#shadow)">
    <rect x="32" y="34" width="716" height="1620" rx="32" fill="url(#terminal)" stroke="#2c5d49" stroke-width="2" />
    <path d="M32 66a32 32 0 0 1 32-32h652a32 32 0 0 1 32 32v88H32z" fill="#13231c" />
    <line x1="32" y1="154" x2="748" y2="154" stroke="#29483c" stroke-width="2" />
    <circle cx="76" cy="92" r="9" fill="#f07468" />
    <circle cx="108" cy="92" r="9" fill="#f0c85f" />
    <circle cx="140" cy="92" r="9" fill="#5fc579" />
    <text x="174" y="101" class="mono muted">sloth-agent</text>
    <rect x="504" y="67" width="206" height="50" rx="25" fill="#153e2d" stroke="#2d7450" />
    <text x="607" y="100" text-anchor="middle" class="mono" fill="#8ce2ad" font-size="19">PREVIEW FIRST</text>

    <g transform="translate(72 222)">
      <text class="mono label" x="0" y="0">REVIEW TODAY'S TRANSACTIONS</text>
      <text class="mono command" x="0" y="60"><tspan fill="#62d690">$</tspan> sloth-agent transactions \</text>
      <text class="mono command" x="28" y="104">--assignment-scope personal \</text>
      <text class="mono command" x="28" y="148">--uncategorized --limit 50</text>
      <rect x="0" y="188" width="636" height="146" rx="18" fill="#0d1c16" stroke="#203c31" />
      <text class="mono muted" x="22" y="232">{ <tspan class="json-key">"transactions"</tspan>:</text>
      <text class="mono muted" x="48" y="274"><tspan class="json-value">[ …12 items ]</tspan>,</text>
      <text class="mono muted" x="22" y="316"><tspan class="json-key">"nextCursor"</tspan>: null }</text>
    </g>

    <line x1="72" y1="612" x2="708" y2="612" stroke="#203b30" stroke-width="2" />

    <g transform="translate(72 676)">
      <text class="mono label" x="0" y="0">PREVIEW A BUDGET MOVE</text>
      <text class="mono command" x="0" y="60"><tspan fill="#62d690">$</tspan> sloth-agent budget move \</text>
      <text class="mono command" x="28" y="104">--scope personal \</text>
      <text class="mono command" x="28" y="148">--from-category-id activities \</text>
      <text class="mono command" x="28" y="192">--to-category-id groceries \</text>
      <text class="mono command" x="28" y="236">--amount 52.95</text>
      <rect x="0" y="276" width="636" height="192" rx="18" fill="#0d1c16" stroke="#203c31" />
      <text class="mono muted" x="22" y="320">{ <tspan class="json-key">"dryRun"</tspan>: true,</text>
      <text class="mono muted" x="48" y="362"><tspan class="json-key">"method"</tspan>: <tspan class="json-value">"POST"</tspan>,</text>
      <text class="mono muted" x="48" y="404"><tspan class="json-key">"amountPence"</tspan>: <tspan class="json-value">5295</tspan> }</text>
      <text class="mono muted" x="22" y="448" fill="#76d49a">✓ no changes made</text>
    </g>

    <line x1="72" y1="1210" x2="708" y2="1210" stroke="#203b30" stroke-width="2" />

    <g transform="translate(72 1276)">
      <text class="mono label" x="0" y="0">CHECK A GOAL'S AFFORDABILITY</text>
      <text class="mono command" x="0" y="60"><tspan fill="#62d690">$</tspan> sloth-agent goals</text>
      <rect x="0" y="98" width="636" height="142" rx="18" fill="#0d1c16" stroke="#203c31" />
      <text class="mono muted" x="22" y="144">Returns current goals,</text>
      <text class="mono muted" x="22" y="186">priorities, and forecast months</text>
      <text class="mono muted" x="22" y="228" fill="#76d49a">→ ready for your agent to assess</text>
    </g>

    <rect x="72" y="1572" width="300" height="46" rx="23" fill="#14372a" />
    <text x="222" y="1602" text-anchor="middle" class="mono" fill="#8ce2ad" font-size="20">MCP SUPPORT COMING SOON</text>
  </g>
</svg>
