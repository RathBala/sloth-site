<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">Sloth Agent CLI automation session</title>
  <desc id="description">Terminal commands for reviewing uncategorised transactions, previewing a budget move, and reading savings goals before an affordability check.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063f2d" />
      <stop offset="1" stop-color="#0b211b" />
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101915" />
      <stop offset="1" stop-color="#07110d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00100a" flood-opacity="0.45" />
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { fill: #76d49a; font-size: 22px; font-weight: 700; letter-spacing: 1.4px; }
      .command { fill: #f5fbf7; font-size: 27px; }
      .muted { fill: #9eb5aa; font-size: 23px; }
      .json-key { fill: #8ad5b0; font-size: 24px; }
      .json-value { fill: #f5cf72; font-size: 24px; }
    </style>
  </defs>

  <rect width="1440" height="1080" fill="url(#background)" />
  <circle cx="132" cy="126" r="206" fill="#18a867" opacity="0.08" />
  <circle cx="1310" cy="938" r="260" fill="#f0c85f" opacity="0.06" />

  <g filter="url(#shadow)">
    <rect x="70" y="64" width="1300" height="952" rx="34" fill="url(#terminal)" stroke="#2c5d49" stroke-width="2" />
    <path d="M70 98a34 34 0 0 1 34-34h1232a34 34 0 0 1 34 34v68H70z" fill="#13231c" />
    <line x1="70" y1="166" x2="1370" y2="166" stroke="#29483c" stroke-width="2" />
    <circle cx="116" cy="115" r="10" fill="#f07468" />
    <circle cx="150" cy="115" r="10" fill="#f0c85f" />
    <circle cx="184" cy="115" r="10" fill="#5fc579" />
    <text x="226" y="125" class="mono muted" fill="#d8e6de">sloth-agent — automation session</text>
    <rect x="1118" y="91" width="205" height="46" rx="23" fill="#153e2d" stroke="#2d7450" />
    <text x="1220" y="121" text-anchor="middle" class="mono" fill="#8ce2ad" font-size="20">PREVIEW FIRST</text>

    <g transform="translate(122 220)">
      <text class="mono label" x="0" y="0">REVIEW TODAY'S TRANSACTIONS</text>
      <text class="mono command" x="0" y="50"><tspan fill="#62d690">$</tspan> sloth-agent transactions --assignment-scope personal \</text>
      <text class="mono command" x="32" y="90">--uncategorized --limit 50</text>
      <rect x="0" y="120" width="1196" height="108" rx="18" fill="#0d1c16" stroke="#203c31" />
      <text class="mono muted" x="24" y="158">{ <tspan class="json-key">"transactions"</tspan>: <tspan class="json-value">[ …12 items ]</tspan>,</text>
      <text class="mono muted" x="24" y="195"><tspan class="json-key">"nextCursor"</tspan>: <tspan fill="#c9d8d0">null</tspan> }</text>
    </g>

    <line x1="122" y1="482" x2="1318" y2="482" stroke="#203b30" stroke-width="2" />

    <g transform="translate(122 538)">
      <text class="mono label" x="0" y="0">PREVIEW A BUDGET REALLOCATION</text>
      <text class="mono command" x="0" y="50"><tspan fill="#62d690">$</tspan> sloth-agent budget move --scope personal \</text>
      <text class="mono command" x="32" y="90">--from-category-id activities --to-category-id groceries \</text>
      <text class="mono command" x="32" y="130">--amount 52.95</text>
      <rect x="0" y="158" width="1196" height="118" rx="18" fill="#0d1c16" stroke="#203c31" />
      <text class="mono muted" x="24" y="199">{ <tspan class="json-key">"dryRun"</tspan>: <tspan fill="#c9d8d0">true</tspan>, <tspan class="json-key">"method"</tspan>: <tspan class="json-value">"POST"</tspan>,</text>
      <text class="mono muted" x="24" y="239"><tspan class="json-key">"amountPence"</tspan>: <tspan class="json-value">5295</tspan> }  <tspan fill="#7e958a">// no changes made</tspan></text>
    </g>

    <line x1="122" y1="850" x2="1318" y2="850" stroke="#203b30" stroke-width="2" />

    <g transform="translate(122 906)">
      <text class="mono label" x="0" y="0">READ GOALS BEFORE AN AFFORDABILITY CHECK</text>
      <text class="mono command" x="0" y="50"><tspan fill="#62d690">$</tspan> sloth-agent goals</text>
      <text class="mono muted" x="408" y="50">→ returns current goals and forecast months</text>
    </g>
  </g>
</svg>
