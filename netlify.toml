[build]
  command = "yarn build"
  publish = "src"
  functions = "netlify/functions"

# Prefer consistent trailing slash for static index routes
[[redirects]]
  from = "/wedding-fund"
  to = "/wedding-fund/"
  status = 301

[[redirects]]
  from = "/home-planner"
  to = "/home-planner/"
  status = 301
